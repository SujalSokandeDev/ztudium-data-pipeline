name: SEODash Data Retention Cleanup

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without deleting detailed rows"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      retention_days:
        description: "Detailed-row retention window"
        required: false
        default: "90"
      batch_size:
        description: "Rows deleted per transaction batch"
        required: false
        default: "500"

permissions:
  contents: read

jobs:
  data-retention-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          python - <<'PY'
          import os
          import sys

          required = ["SEODASH_DATABASE_URL"]
          missing = [name for name in required if not os.getenv(name)]
          if missing:
              print("Missing required secrets:", ", ".join(missing))
              sys.exit(1)
          print("All required secrets are present.")
          PY
        env:
          SEODASH_DATABASE_URL: ${{ secrets.SEODASH_DATABASE_URL }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run retention cleanup
        env:
          SEODASH_DATABASE_URL: ${{ secrets.SEODASH_DATABASE_URL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'true' }}
          RETENTION_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.retention_days || '90' }}
          RETENTION_BATCH_SIZE: ${{ github.event_name == 'workflow_dispatch' && inputs.batch_size || '500' }}
        run: python scripts/data_retention_cleanup.py
