name: Validate Backlink URLs

on:
  schedule:
    - cron: '15 2 * * *'
  workflow_run:
    workflows:
      - Process Ahrefs CSVs
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-backlink-urls
  cancel-in-progress: false

jobs:
  validate-backlink-urls:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate backlink URLs
        env:
          SEODASH_DATABASE_URL: ${{ secrets.SEODASH_DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          URL_VALIDATION_CHECKPOINT_TABLE: pipeline_checkpoints
        run: python scripts/validate_backlink_urls.py --batch-size 50 --batch-delay 2
