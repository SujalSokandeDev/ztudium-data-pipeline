name: SEODash Intelligence Reports

on:
  schedule:
    # Refresh deterministic intelligence daily after the Google fetch window.
    - cron: '15 2 * * *'
  workflow_run:
    workflows:
      - Daily Google Fetch (GSC + GA4)
      - Process Ahrefs CSVs
      - Process Keyword Gap CSVs
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seodash-intelligence:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300

    env:
      SEODASH_DATABASE_URL: ${{ secrets.SEODASH_DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compute trend metrics
        run: python scripts/compute_trends.py

      - name: Generate SEODash intelligence reports
        run: python scripts/generate_insights.py
